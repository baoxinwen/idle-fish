# IdleFish — Docker 镜像自动构建
# push 到 main 时构建并推送至 ghcr.io/baoxinwen/idlefish
# 标签：latest + git short sha

name: Build and Push Docker Image

on:
  push:
    branches: [main]
  # 手动触发
  workflow_dispatch:

env:
  IMAGE_NAME: idlefish

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # 推送到 GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          # 镜像全名小写
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/idlefish" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # latest（主线最新）+ short sha（可追溯版本）
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
