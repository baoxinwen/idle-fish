# idle-fish — Docker 镜像自动构建
# push 到 main 时构建并推送至 ghcr.io/baoxinwen/idle-fish
# 标签：latest + git short sha

name: Build and Push Docker Image

on:
  push:
    branches: [main]
  # 手动触发
  workflow_dispatch:

env:
  IMAGE_NAME: idle-fish

jobs:
  # I-7：测试门禁——计价引擎/server/client 的单元测试不过，不构建不发布
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 测试工具链需要 Node 22（jsdom 30 的 undici 依赖用到 markAsUncloneable）；
          # 应用运行时镜像仍为 node:20，不受影响
          node-version: 22

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.18.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # @idle-fish/shared 的包入口指向 dist/，client 测试引用其运行时导出前需先构建
      - name: Build shared
        run: pnpm --filter @idle-fish/shared build

      - name: Run tests
        run: |
          pnpm --filter @idle-fish/shared test
          pnpm --filter @idle-fish/server test
          pnpm --filter @idle-fish/client test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # 推送到 GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          # 镜像全名小写
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/idle-fish" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # latest（主线最新）+ short sha（可追溯版本）
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
