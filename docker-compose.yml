services:
  idlefish:
    image: ghcr.io/baoxinwen/idlefish:latest
    container_name: idlefish
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - idlefish-data:/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - IDLEFISH_HOST=0.0.0.0
      - IDLEFISH_TRUST_PROXY=1
      - IDLEFISH_DATA_DIR=/data
      - TZ=Asia/Shanghai

volumes:
  idlefish-data:
